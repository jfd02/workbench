# Workbench for iPhone. This file is the source of truth for the Xcode project:
# edit it, then regenerate with
#
#     cd iOS && xcodegen generate
#
# The .xcodeproj is generated output and is overwritten each time.
name: TabTermMobile

options:
  bundleIdPrefix: com.tabterm
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    # Supply your own DEVELOPMENT_TEAM when building for a device.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

packages:
  TabTermKit:
    path: ../TabTermKit
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.20.0

targets:
  TabTermMobile:
    productName: Workbench
    type: application
    platform: iOS
    sources:
      - path: TabTermMobile
    dependencies:
      - package: TabTermKit
      - package: SwiftTerm
    settings:
      base:
        PRODUCT_NAME: Workbench
        PRODUCT_MODULE_NAME: TabTermMobile
        PRODUCT_BUNDLE_IDENTIFIER: com.tabterm.TabTermMobile
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    info:
      path: TabTermMobile/Info.plist
      properties:
        CFBundleDisplayName: Workbench
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Dark
        UIBackgroundModes:
          - remote-notification
        CFBundleURLTypes:
          - CFBundleURLName: com.tabterm.TabTermMobile.pair
            CFBundleURLSchemes:
              - tabterm
        NSCameraUsageDescription: Workbench uses the camera to scan the pairing code your Mac shows.
        NSLocalNetworkUsageDescription: Workbench connects to Workbench on your Mac over your network.
    entitlements:
      path: TabTermMobile/TabTermMobile.entitlements
      properties:
        aps-environment: development

  TabTermMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TabTermMobileTests
    dependencies:
      - target: TabTermMobile
      - package: TabTermKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.tabterm.TabTermMobile.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Workbench.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Workbench
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  TabTermMobile:
    build:
      targets:
        TabTermMobile: all
        TabTermMobileTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TabTermMobileTests
    archive:
      config: Release
